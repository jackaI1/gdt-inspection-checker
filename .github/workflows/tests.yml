name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest -v
      - name: Run the example check
        run: |
          gdt-check examples/bracket_spec.toml examples/bracket_measurements.csv \
            --report output/report.md --plot output/plot.png || test $? -eq 1
          test -s output/report.md && test -s output/plot.png
